---
- name: Deploy CloudFormation stack
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    template_path: "{{ (playbook_dir, '..', 'template.yaml') | path_join | realpath }}"
    parameters_file: "{{ (playbook_dir, '..', 'vars', 'parameters.yml') | path_join | realpath }}"
    cfn_parameters:
      BucketName: 'yemanenigusseresume.com'
      ACMCertificateArn: 'arn:aws:acm:us-east-1:164172926128:certificate/e073ad16-8ca5-4fd3-9c93-0eb635d4b45e'
  vars_files:
    - vaults/prod.yml
  tasks:
    - name: Deploy and Update stack
      amazon.aws.cloudformation:
        region: "{{ AWS_REGION }}"
        aws_access_key: "{{ AWS_ACCESS_KEY_ID }}"
        aws_secret_key: "{{ AWS_SECRET_ACCESS_KEY }}"
        stack_name: "{{ STACK_NAME }}"
        state: present
        template: "{{ template_path }}"
        template_parameters: "{{ cfn_parameters }}"
        capabilities:
          - CAPABILITY_NAMED_IAM
          - CAPABILITY_AUTO_EXPAND
        on_create_failure: DO_NOTHING 
        # Set to true to wait for stack completion (recommended)
      register: cfn_result 
    - name: Show stack outputs
      debug:
        var: cfn_result.stack_outputs

   
