---
- name: Deploy Azure Front Door (Standard) – Idempotent
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resource_group: cloud-resume-challenge
    rg_location: eastus
    afd_location: global

    storage_account_name: yemanenigussecrc2026

    dns_zone_rg: cloud-resume-challenge
    dns_zone_name: yemanenigusseresume.net
    domain_fqdn: www.yemanenigusseresume.net
    apex_fqdn: yemanenigusseresume.net

    fd_profile_name: fd-profile-crc
    fd_endpoint_name: fd-endpoint-crc

    bicep_file: "{{ playbook_dir }}/../deploy-cdn.bicep"
    built_json: "{{ playbook_dir }}/../deploy-cdn.built.json"
    deployment_name: crc-cdn-deploy

  tasks:
    - name: Ensure resource group exists
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        location: "{{ rg_location }}"

    - name: Get static website endpoint
      ansible.builtin.command: >
        az storage account show
        --resource-group {{ resource_group }}
        --name {{ storage_account_name }}
        --query "primaryEndpoints.web"
        --output tsv
      register: web_endpoint
      changed_when: false

    - name: Fail if static website is not enabled
      ansible.builtin.fail:
        msg: "Static website is not enabled on storage account."
      when: web_endpoint.stdout | trim == ""

    - name: Derive origin hostname
      ansible.builtin.set_fact:
        origin_hostname: >-
          {{ web_endpoint.stdout
             | trim
             | regex_replace('^https?://', '')
             | regex_replace('/$', '') }}

    - name: Compile Bicep
      ansible.builtin.command: >
        az bicep build
        --file {{ bicep_file }}
        --outfile {{ built_json }}
      changed_when: true

    - name: Validate deployment
      ansible.builtin.command: >
        az deployment group validate
        --resource-group {{ resource_group }}
        --template-file {{ built_json }}
        --parameters
          location={{ afd_location }}
          origin_hostname={{ origin_hostname }}
          domain_fqdn={{ domain_fqdn }}
          apex_fqdn={{ apex_fqdn }}
          dns_zone_name={{ dns_zone_name }}
          dns_zone_rg={{ dns_zone_rg }}
          fd_profile_name={{ fd_profile_name }}
          fd_endpoint_name={{ fd_endpoint_name }}
      changed_when: false

    - name: Deploy Front Door
      ansible.builtin.command: >
        az deployment group create
        --resource-group {{ resource_group }}
        --name {{ deployment_name }}
        --template-file {{ built_json }}
        --parameters
          location={{ afd_location }}
          origin_hostname={{ origin_hostname }}
          domain_fqdn={{ domain_fqdn }}
          apex_fqdn={{ apex_fqdn }}
          dns_zone_name={{ dns_zone_name }}
          dns_zone_rg={{ dns_zone_rg }}
          fd_profile_name={{ fd_profile_name }}
          fd_endpoint_name={{ fd_endpoint_name }}
      register: afd_deploy

    - name: Extract Front Door endpoint
      ansible.builtin.set_fact:
        afd_endpoint_host: "{{ (afd_deploy.stdout | from_json).properties.outputs.afd_endpoint.value }}"

    - name: Ensure CNAME for www
      ansible.builtin.command: >
        az network dns record-set cname set-record
        --resource-group {{ dns_zone_rg }}
        --zone-name {{ dns_zone_name }}
        --record-set-name www
        --cname {{ afd_endpoint_host }}
      changed_when: false

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "Front Door Profile: {{ fd_profile_name }}"
          - "Endpoint: {{ afd_endpoint_host }}"
          - "Origin: {{ origin_hostname }}"
