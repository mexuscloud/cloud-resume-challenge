---
- name: Deploy Storage Account via Bicep
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
  - azure.azcollection

  vars:
    resource_group: cloud-resume-challenge
    location: eastus
    storage_account_name: yemanenigussecrc2026
    bicep_file: "{{ playbook_dir }}/../deploy-storage.bicep"
    built_json: "{{ playbook_dir }}/../deploy-storage.built.json"
    deployment_name: "crc-storage-deploy"

  tasks:
    - name: Compile Bicep -> ARM JSON (using bicep via azure CLI)
      ansible.builtin.command: >
        az bicep build 
        --file {{ bicep_file }} 
        --outfile {{ built_json }}
      changed_when: true

      # 1) Pre-Validate with Azure CLI - great for errors with files/line numbers 
    - name: Validate ARM Template & Parameters with (CLI)
      ansible.builtin.command: >
        az deployment group validate 
        --resource-group {{ resource_group }} 
        --template-file {{ built_json }} 
        --parameters location={{ location }} storage_account_name={{ storage_account_name }} 
      register: cli_validate
      changed_when: false
      failed_when: cli_validate.rc != 0

      # 2) What-if preview - shows adds/changes/deletes instead of failing late
    - name: What-If Preview (CLI)
      ansible.builtin.command: >
        az deployment group what-if 
        --resource-group {{ resource_group }} 
        --template-file {{ built_json }} 
        --parameters location={{ location }} storage_account_name={{ storage_account_name }} 
        --no-pretty-print
      register: cli_whatif
      changed_when: false
      # don't fail the play if what-if reports changes; it's just informational
      failed_when: cli_whatif.rc != 0

    - name: show what-if summary
      ansible.builtin.debug:
        msg: "{{ cli_whatif.stdout | default('No what-if output') }}"  

    - name: Ensure resource group exists
      azure.azcollection.azure_rm_resourcegroup:  
        name: "{{ resource_group }}"
        location: "{{ location }}"

    - name: Load Compiled ARM Template
      ansible.builtin.set_fact:
        arm_template: "{{ lookup('file', built_json) | from_json }}"
    
    - name: Deploy Template with parameters (via azure_rm_deployment)
      azure.azcollection.azure_rm_deployment:
        resource_group: "{{ resource_group }}"
        name: "{{ deployment_name }}"
        state: present
        # You can also use template_link (URI). Here we inline the JSON dict: 
        template: "{{ arm_template }}"
        deployment_mode: incremental
        location: "{{ location }}"
        parameters:
          location:
            value: "{{ location }}"
          storage_account_name:
            value: "{{ storage_account_name }}"
      register: deploy_out

    # --- After storage.bicep is deployed successfully ---
    - name: Check is static website is enabled 
      ansible.builtin.command: >
        az storage blob service-properties show 
        --account-name {{ storage_account_name }} 
        --auth-mode login
        --query "staticWebsite.enabled" 
        --output tsv
      register: static_website_enabled
      changed_when: false
    
    - name: Enable Static Website (index.html + 404 to index.html)
      ansible.builtin.command: >
        az storage blob service-properties update 
        --account-name {{ storage_account_name }} 
        --auth-mode login
        --static-website 
        --index-document index.html 
        --404-document index.html
      when: static_website_enabled.stdout.strip() != "true"
      register: enable_static
      changed_when: enable_static.rc == 0

    - name: Get static website endpoint (hostname only)
      ansible.builtin.command: >
          az storage account show 
          --resource-group {{ resource_group }} 
          --name {{ storage_account_name }} 
          --query "primaryEndpoints.web" 
          --output tsv
      register: web_ep
      changed_when: false

    - name: Set origin hostname fact (for  Front door)
      ansible.builtin.set_fact:
        origin_hostname: "{{ web_ep.stdout | regex_replace('^https?://', '') | regex_replace('/$', '') }}"

    - name: Show deployment result summary
      ansible.builtin.debug:
        msg: 
          - "Provisioning State: {{ deploy_out.deployment.properties.provisioningState | default('N/A') }}"
          - "Storage Account Name: {{ storage_account_name }}"
          - "Resource Group: {{ resource_group }}"
          - "Location: {{ location }}"