---
- name: Purge Azure CDN / Front Door endpoint cache
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    resource_group: cloud-resume-challenge
    profile_name: "fd-profile-vyifg5kgsczr4"      # Front Door profile name
    endpoint_name: "ep-vyifg5kgsczr4"  # Front Door endpoint name
    paths:
      - '/*'                                      # Paths to purge

  tasks:
    - name: Purge AFD endpoint cache
      ansible.builtin.command: >
        az afd endpoint purge
        --resource-group {{ resource_group }}
        --profile-name {{ profile_name }}
        --endpoint-name {{ endpoint_name }}
        --content-paths {{ paths | to_json }}
      register: purge_out
      changed_when: purge_out.rc == 0

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Purge command executed with return code: {{ purge_out.rc }}"
          - "Purge output: {{ purge_out.stdout }}"
          - profile: "{{ profile_name }}"
          - endpoint: "{{ endpoint_name }}"
          - paths: "{{ paths }}"

