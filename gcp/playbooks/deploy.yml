---
- name: Deploy GCP static website using Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vaults/prod.yml
  
  vars:
    project_path: "{{ playbook_dir }}/.."
    tf_vars_file: "{{ project_path }}/terraform.tfvars"

  tasks:
    - name: Ensure Terraform is available
      ansible.builtin.command: terraform version
      changed_when: false

    - name: Create temporary file for SA key
      ansible.builtin.tempfile:
        state: file
        suffix: ".json"
      register: sa_key_file

    - name: Write GCP service account key to a file
      ansible.builtin.copy:
        dest: "{{ sa_key_file.path }}"
        content: "{{ gcp_sa_key_json }}"
        mode: '0600'

    - name: Terraform init/plan/apply
      community.general.terraform:
        project_path: "{{ project_path }}"
        force_init: true
        state: present
        variables_file: "{{ tf_vars_file if bucket_name is not defined else omit }}"
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ sa_key_file.path }}"
      register: tf_apply

    - name: Show Terraform output(if any)
      ansible.builtin.debug:
        var: tf_apply
