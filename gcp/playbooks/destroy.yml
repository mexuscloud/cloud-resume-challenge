---
- name: Destroy GCP static website using Terraform
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vaults/prod.yml

  vars:
    project_path: "{{ playbook_dir }}/.."
    tf_vars_file: "{{ project_path }}/terraform.tfvars"

  tasks:

    - name: Ensure Terraform is available
      ansible.builtin.command: terraform version
      changed_when: false

    - name: Create temporary file for SA key
      ansible.builtin.tempfile:
        state: file
        suffix: ".json"
      register: sa_key_file

    - name: Write GCP service account key to file
      ansible.builtin.copy:
        dest: "{{ sa_key_file.path }}"
        content: "{{ gcp_sa_key_json }}"
        mode: "0600"

    - name: Terraform destroy
      community.general.terraform:
        project_path: "{{ project_path }}"
        force_init: true
        state: absent
        variables_file: "{{ tf_vars_file }}"
      environment:
        GOOGLE_APPLICATION_CREDENTIALS: "{{ sa_key_file.path }}"
      register: tf_destroy

    - name: Show Terraform destroy output
      ansible.builtin.debug:
        var: tf_destroy