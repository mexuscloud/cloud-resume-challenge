---
- name: Build Vite App and Upload to GCS
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vaults/prod.yml

  vars:
    gcp_project: "cloud-resume-challenge-485617"
    gcs_bucket: "yemanenigusseresume.org"      # existing bucket name
    project_root: "{{ playbook_dir | realpath }}/../.."
    frontend_dir: "{{ project_root }}/frontend"
    build_dir: "{{ frontend_dir }}/dist"

  environment:
    CLOUDSDK_CORE_PROJECT: "{{ gcp_project }}"

  tasks:
    - name: Ensure gcloud CLI is installed
      ansible.builtin.command: gcloud --version
      changed_when: false

    - name: Ensure Node is available (optional sanity check)
      ansible.builtin.command: node --version
      changed_when: false
      failed_when: false

    # --- Auth like your deploy.yml (temporary SA key file) ---
    - name: Create temporary file for SA key
      ansible.builtin.tempfile:
        state: file
        suffix: ".json"
      register: sa_key_file

    - name: Write GCP service account key to a file (from Vault)
      ansible.builtin.copy:
        dest: "{{ sa_key_file.path }}"
        content: "{{ gcp_sa_key_json }}"
        mode: '0600'

    - name: Activate service account for gcloud CLI
      ansible.builtin.command:
        argv:
          - gcloud
          - auth
          - activate-service-account
          - --key-file={{ sa_key_file.path }}
      changed_when: false

    - name: Set gcloud project
      ansible.builtin.command:
        argv: [ "gcloud", "config", "set", "project", "{{ gcp_project }}" ]
      changed_when: false

    - name: Verify active account (debug)
      ansible.builtin.command:
        argv: [ "gcloud", "auth", "list", "--filter=status:ACTIVE", "--format=value(account)" ]
      register: active_acct
      changed_when: false

    - name: Show active account
      ansible.builtin.debug:
        var: active_acct.stdout

    # --- Build ---
    - name: Install node dependencies
      community.general.npm:
        path: "{{ frontend_dir }}"
        state: present
        production: false
        ci: true

    - name: Build Vite App
      ansible.builtin.shell: npm run build
      args:
        chdir: "{{ frontend_dir }}"

    - name: Confirm build dir exists
      ansible.builtin.stat:
        path: "{{ build_dir }}"
      register: build_stat

    - name: Fail if build output missing
      ansible.builtin.fail:
        msg: "Build dir {{ build_dir }} not found. Build failed."
      when: not build_stat.stat.exists

    # --- Upload ---
    - name: Sync build output to GCS bucket (delete removed files)
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - rsync
          - --recursive
          - --delete-unmatched-destination-objects
          - "{{ build_dir }}"
          - "gs://{{ gcs_bucket }}"
      register: rsync_out
      changed_when: "'Copied' in rsync_out.stdout or 'Removing' in rsync_out.stdout"

    # --- Cache-Control headers ---
    # IMPORTANT: use argv and NO SPACES after commas in cache-control values.

    - name: Apply long cache to assets/**
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - objects
          - update
          - --recursive
          - --add-cache-control=public,max-age=31536000,immutable
          - "gs://{{ gcs_bucket }}/assets/"
      register: cache_assets
      changed_when: "'Updating' in cache_assets.stdout"
      failed_when: false   # don't fail if assets/ doesn't exist yet

    - name: List top-level files in build dir
      ansible.builtin.find:
        path: "{{ build_dir }}"
        file_type: file
        recurse: no
      register: top_files

    - name: Apply short cache to top-level files
      ansible.builtin.command:
        argv:
          - gcloud
          - storage
          - objects
          - update
          - --add-cache-control=public,max-age=300
          - "gs://{{ gcs_bucket }}/{{ item.path | basename }}"
      loop: "{{ top_files.files }}"
      register: cache_root
      changed_when: >
        cache_root is defined and (
          (cache_root.stdout is defined and 'Updating' in cache_root.stdout) or
          (cache_root.results is defined and
           (cache_root.results | selectattr('stdout','search','Updating') | list | length) > 0)
        )
      failed_when: false